name: Platform checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: risk_test
          POSTGRES_USER: risk_test
          POSTGRES_PASSWORD: risk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U risk_test -d risk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RISK_TEST_DATABASE_URL: postgresql+psycopg://risk_test:risk_test@localhost:5432/risk_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.11
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
