[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "risk-investigation-platform"
version = "0.3.0"
description = "Additive investigation services for the AWS Risk Portfolio"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.54,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
]

[project.optional-dependencies]
onnx-cpu = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2",
]
onnx-openvino = [
  "numpy>=1.26,<3",
  "onnxruntime-openvino==1.24.1",
  "openvino==2025.4.1; sys_platform == 'win32'",
]

[project.scripts]
risk-platform = "risk_platform.runtime:serve"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1.4,<2",
    "httpx>=0.28,<1",
    "aiosqlite>=0.21,<1",
    "ruff>=0.11,<1",
    "bandit>=1.8,<2",
    "pip-audit>=2.9,<3",
    "numpy>=1.26,<3",
    "onnx>=1.16,<2",
]

[tool.uv]
conflicts = [
  [
    { extra = "onnx-cpu" },
    { extra = "onnx-openvino" },
  ],
]

[tool.hatch.build.targets.wheel]
packages = ["src/risk_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["postgres: requires RISK_TEST_DATABASE_URL pointing to an isolated PostgreSQL database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
